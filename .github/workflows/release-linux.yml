# Linux builds (experimental): AppImage and .deb, without search by meaning (its worker is not
# built for Linux yet). Same chain as tools/linux/build.sh, on a clean Ubuntu 22.04 runner (the
# AppImage runs on distributions at least as recent).
# - Pushing a `v*` tag: build, check the .deb and the AppImage start, then add both to the GitHub
#   release that release.yml publishes for the same tag (waits for it).
# - Manual run: same chain without publishing; the bundles and the screenshot are run artifacts.
name: Release (Linux, experimental)
run-name: ${{ startsWith(github.ref, 'refs/tags/') && format('Linux {0}', github.ref_name) || format('Linux dry run ({0})', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf \
            xvfb openbox imagemagick dbus-x11 libfuse2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build (AppImage and .deb)
        run: npx tauri build --bundles deb,appimage

      - name: Collect bundles
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/Humcase-linux-x86_64-experimental.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb dist/Humcase-linux-amd64-experimental.deb
          (cd dist && sha256sum * > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)

      # Under a throwaway HOME: the data folder is $HOME/.humcase of a temporary directory.
      - name: Install the .deb and run the CLI
        run: |
          sudo apt-get install -y ./dist/Humcase-linux-amd64-experimental.deb
          export HOME="$RUNNER_TEMP/home-deb" && mkdir -p "$HOME"
          humcase tools > "$RUNNER_TEMP/tools.txt"
          grep -q add_note "$RUNNER_TEMP/tools.txt"
          echo "humcase lists $(wc -l < "$RUNNER_TEMP/tools.txt") tools"
          humcase projects > /dev/null
          test -f "$HOME/.humcase/humcase.db"
          sudo apt-get remove -y humcase

      - name: Open the AppImage window once
        run: |
          export HOME="$RUNNER_TEMP/home-appimage" && mkdir -p "$HOME"
          export APPIMAGE_EXTRACT_AND_RUN=1 DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 & sleep 2
          openbox & sleep 1
          chmod +x dist/Humcase-linux-x86_64-experimental.AppImage
          dbus-launch ./dist/Humcase-linux-x86_64-experimental.AppImage > "$RUNNER_TEMP/app.log" 2>&1 &
          APP=$!
          sleep 40
          import -window root "$RUNNER_TEMP/first-launch-linux.png"
          if ! kill -0 $APP 2>/dev/null; then cat "$RUNNER_TEMP/app.log"; echo "the AppImage exited at first launch"; exit 1; fi
          test -f "$HOME/.humcase/humcase.db" || { cat "$RUNNER_TEMP/app.log"; echo "no database created"; exit 1; }
          kill $APP

      - name: First-launch screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-launch-linux-${{ github.sha }}
          path: ${{ runner.temp }}/first-launch-linux.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: humcase-linux-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 60); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 60; done
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json body -q .body > notes.md
          {
            echo
            echo "### Linux (experimental)"
            echo "An AppImage and a .deb for x86_64, built on Ubuntu 22.04. Search by meaning is off on Linux, and the global quick-capture shortcut needs an X11 session."
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
