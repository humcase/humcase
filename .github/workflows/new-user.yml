name: New user journey

# Downloads the public installer from humcase.com on a clean Windows runner, installs it as a user would,
# then drives the app with real clicks (UI Automation) and its MCP server like a first-time user. Screenshots and texts are artifacts.
on:
  push:
    branches: [test/new-user-journey]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # With tools/new-user/BUILD_FROM_SOURCE, the installer is built from this commit instead
      # (to check a fix before it is released); otherwise it is the public download.
      - name: Build from source?
        id: src
        shell: pwsh
        run: '"build=$(Test-Path tools/new-user/BUILD_FROM_SOURCE)".ToLower() >> $env:GITHUB_OUTPUT'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.src.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.src.outputs.build == 'true'
        with:
          workspaces: src-tauri
      - name: Build the installer from this commit
        if: steps.src.outputs.build == 'true'
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix frontend
          node scripts/build-meaning.mjs
          npx tauri build --config src-tauri/tauri.meaning.conf.json --bundles nsis
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "$env:RUNNER_TEMP\Humcase-setup-x64.exe"

      - name: Download from the website
        if: steps.src.outputs.build != 'true'
        shell: pwsh
        run: |
          # humcase.com answers datacenter addresses with a Cloudflare challenge: fall back to the link the site shows.
          $href = 'https://github.com/humcase/humcase/releases/latest/download/Humcase-setup-x64.exe'
          try {
            $site = Invoke-WebRequest https://humcase.com -UseBasicParsing
            $found = ($site.Links | Where-Object href -match 'Humcase-setup-x64\.exe' | Select-Object -First 1).href
            if ($found) { $href = $found; "Download link read on the site: $href" }
          } catch { "humcase.com not readable from this runner (challenge), using the site's link: $href" }
          Invoke-WebRequest $href -OutFile "$env:RUNNER_TEMP\Humcase-setup-x64.exe"
          Invoke-WebRequest https://github.com/humcase/humcase/releases/latest/download/SHA256SUMS.txt -OutFile "$env:RUNNER_TEMP\SHA256SUMS.txt"
          $sums = Get-Content "$env:RUNNER_TEMP\SHA256SUMS.txt" -Raw
          $hash = (Get-FileHash "$env:RUNNER_TEMP\Humcase-setup-x64.exe" -Algorithm SHA256).Hash.ToLower()
          if ($sums -notmatch $hash) { throw "checksum of the downloaded installer is not in SHA256SUMS.txt" }
          "Checksum OK: $hash"

      - name: Install with the defaults
        shell: pwsh
        run: |
          $setup = Start-Process "$env:RUNNER_TEMP\Humcase-setup-x64.exe" -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "installer exit code $($setup.ExitCode)" }
          $exe = Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Filter Humcase.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Humcase.exe not found after install" }
          "Installed at $($exe.FullName)"
          "HUMCASE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Get-ChildItem "$env:USERPROFILE\Desktop", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter *Humcase* -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "Shortcut: $($_.FullName)" }

      - name: Tools for the journey
        working-directory: tools/new-user
        run: python -m pip install --quiet pywinauto==0.6.9 pillow==11.0.0

      - name: First launch and first look
        shell: pwsh
        working-directory: tools/new-user
        run: |
          $app = Start-Process $env:HUMCASE_EXE -PassThru
          "APP_PID=$($app.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          New-Item -ItemType Directory -Force out | Out-Null
          $shot.Save("$PWD\out\0-desktop-first-launch.png")
          python ui.py out 2-journey journey.json

      - name: An agent connects through MCP
        working-directory: tools/new-user
        run: node mcp.mjs "$env:HUMCASE_EXE" out/3-mcp.json
        shell: pwsh

      - name: The user sees the agent's work
        shell: pwsh
        working-directory: tools/new-user
        run: |
          python ui.py out 4-after after.json

      - name: Where the data lives
        if: always()
        shell: pwsh
        working-directory: tools/new-user
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & {
            "~/.humcase:"; Get-ChildItem "$env:USERPROFILE\.humcase" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            "AppData (should hold no Humcase data):"; Get-ChildItem $env:APPDATA, $env:LOCALAPPDATA -Directory -Filter '*humcase*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          } | Tee-Object out/6-data.txt
          if ($env:APP_PID) { Stop-Process -Id $env:APP_PID -Force -ErrorAction SilentlyContinue }

      - name: Journey artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: new-user-journey
          path: tools/new-user/out
